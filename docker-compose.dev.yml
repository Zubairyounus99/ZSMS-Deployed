services:
  # ==============================================================================
  # 1. PostgreSQL 16 (Authoritative Database)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: zsms-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zsms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zsms_dev_password}
      POSTGRES_DB: ${DB_NAME:-zsms_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zsms_user} -d ${DB_NAME:-zsms_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zsms_dev_net

  # ==============================================================================
  # 2. Redis 7 (Queues, Locks, Presence)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: zsms-dev-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zsms_dev_net

  # ==============================================================================
  # 3. MinIO (S3 Compatible Object Storage for MMS)
  # ==============================================================================
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: zsms-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-zsms_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-zsms_minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zsms_dev_net

  minio-init:
    image: minio/mc:latest
    container_name: zsms-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-zsms_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-zsms_minio_secret_key}
    volumes:
      - ./docker/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    networks:
      - zsms_dev_net

  # ==============================================================================
  # 4. ZSMS Backend API Service (Go Fiber)
  # ==============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zsms-dev-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_NAME: ZSMS
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${DB_USER:-zsms_user}:${DB_PASSWORD:-zsms_dev_password}@postgres:5432/${DB_NAME:-zsms_db}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-zsms_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-zsms_minio_secret_key}
      S3_BUCKET: zsms-media
      S3_USE_SSL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - zsms_dev_net

  # ==============================================================================
  # 5. ZSMS Background Worker Service (Go Asynq)
  # ==============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zsms-dev-worker
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_NAME: ZSMS
      DATABASE_URL: postgres://${DB_USER:-zsms_user}:${DB_PASSWORD:-zsms_dev_password}@postgres:5432/${DB_NAME:-zsms_db}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-zsms_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-zsms_minio_secret_key}
      S3_BUCKET: zsms-media
      S3_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zsms_dev_net

  # ==============================================================================
  # 6. ZSMS Web Dashboard (Nuxt 3 / Vuetify)
  # ==============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: zsms-dev-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_URL: http://localhost:8080
      NUXT_PUBLIC_APP_NAME: ZSMS
    depends_on:
      api:
        condition: service_healthy
    networks:
      - zsms_dev_net

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:

networks:
  zsms_dev_net:
    driver: bridge

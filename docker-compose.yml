# ==============================================================================
# ZSMS — Production Dokploy Compose Blueprint
# Target Infrastructure: Contabo VPS / Dokploy / Cloudflare Edge
# Domains:
#   - sms.ztechai.us      -> web (:3000)
#   - sms-api.ztechai.us  -> api (:8080)
# ==============================================================================

services:
  # ==============================================================================
  # 1. PostgreSQL 16 (Authoritative Database)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: zsms-prod-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-zsms_user}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?Database password required}}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-zsms_db}}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-$${DB_USER:-zsms_user}} -d $${POSTGRES_DB:-$${DB_NAME:-zsms_db}}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - zsms_prod_net

  # ==============================================================================
  # 2. Redis 7 (Queues, Locks, Presence, Rate Limiting)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: zsms-prod-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_prod_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - zsms_prod_net

  # ==============================================================================
  # 3. MinIO (S3 Object Storage — Optional if Cloudflare R2 is configured)
  # ==============================================================================
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: zsms-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-zsms_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-zsms_minio_secret_key}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zsms_prod_net

  # ==============================================================================
  # 4. ZSMS Backend API Service (Go Fiber)
  # ==============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zsms-prod-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PORT: 8080
      HOST: 0.0.0.0
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-${CORS_ALLOWED_ORIGINS:-https://sms.ztechai.us}}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      # Dokploy / Traefik routing configuration for API
      - "traefik.enable=true"
      - "traefik.http.routers.zsms-api.rule=Host(`sms-api.ztechai.us`)"
      - "traefik.http.routers.zsms-api.entrypoints=websecure"
      - "traefik.http.routers.zsms-api.tls=true"
      - "traefik.http.routers.zsms-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.zsms-api.loadbalancer.server.port=8080"
    networks:
      - zsms_prod_net

  # ==============================================================================
  # 5. ZSMS Background Worker Service (Go Worker)
  # ==============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zsms-prod-worker
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zsms_prod_net

  # ==============================================================================
  # 6. ZSMS Web Dashboard (Nuxt 3 / Vuetify)
  # ==============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: zsms-prod-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE_URL: https://sms-api.ztechai.us
      NUXT_PUBLIC_API_URL: https://sms-api.ztechai.us
      NUXT_PUBLIC_APP_NAME: ZSMS
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      NUXT_PUBLIC_AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      api:
        condition: service_healthy
    labels:
      # Dokploy / Traefik routing configuration for Frontend
      - "traefik.enable=true"
      - "traefik.http.routers.zsms-web.rule=Host(`sms.ztechai.us`)"
      - "traefik.http.routers.zsms-web.entrypoints=websecure"
      - "traefik.http.routers.zsms-web.tls=true"
      - "traefik.http.routers.zsms-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.zsms-web.loadbalancer.server.port=3000"
    networks:
      - zsms_prod_net

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  zsms_prod_net:
    driver: bridge

name: ZSMS Android APK Build & Artifact Upload

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    branches:
      - main
      - staging
      - 'release/**'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK (Android SDK 34 / JDK 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation & Integrity
        id: apk_meta
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Generated APK not found at expected location: $APK_PATH"
            exit 1
          fi

          FILE_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          if [ "$FILE_SIZE_BYTES" -eq 0 ]; then
            echo "::error::Generated APK is 0 bytes"
            exit 1
          fi

          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE_BYTES / 1048576}")
          SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size_bytes=$FILE_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_size_mb=${FILE_SIZE_MB} MB" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_HASH" >> "$GITHUB_OUTPUT"
          echo "app_id=us.ztechai.zsms" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.0-foundation" >> "$GITHUB_OUTPUT"
          echo "version_code=1" >> "$GITHUB_OUTPUT"

      - name: Generate Build Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # 📱 ZSMS Android Cellular Gateway APK Build Summary

          | Metric | Value |
          | :--- | :--- |
          | **Application Name** | ZSMS Cellular Gateway |
          | **Application ID** | `us.ztechai.zsms` |
          | **Debug App ID** | `us.ztechai.zsms.debug` |
          | **Version Name** | `1.0.0-foundation` |
          | **Version Code** | `1` |
          | **Min SDK** | `26` (Android 8.0 Oreo) |
          | **Target SDK** | `34` (Android 14 Upside Down Cake) |
          | **Compile SDK** | `34` |
          | **APK Filename** | `app-debug.apk` |
          | **Artifact Name** | `ZSMS-Android-Debug` |
          | **APK File Size** | ${{ steps.apk_meta.outputs.apk_size_mb }} (${{ steps.apk_meta.outputs.apk_size_bytes }} bytes) |
          | **SHA-256 Checksum** | `${{ steps.apk_meta.outputs.sha256 }}` |
          | **Git Commit SHA** | `${{ github.sha }}` |
          | **Git Branch** | `${{ github.ref_name }}` |
          | **GitHub Run ID** | `${{ github.run_id }}` (Run #${{ github.run_number }}) |

          ### 📲 Physical Testing Instructions:
          1. Download the **`ZSMS-Android-Debug`** zip artifact from the bottom of this run summary.
          2. Unpack `app-debug.apk` and transfer to your physical Android phone (via USB, Drive, or AirDrop/Nearby Share).
          3. Install APK on device (allow unknown sources if prompted).
          4. Open ZSMS, grant SMS permissions, and verify Server URL is `https://sms-api.ztechai.us`.
          5. Pair device on the Web Dashboard (`https://sms.ztechai.us/phones`) using the 6-digit PIN.
          EOF

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSMS-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

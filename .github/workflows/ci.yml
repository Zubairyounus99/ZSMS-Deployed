name: ZSMS CI (Backend & Frontend)

on:
  push:
    branches:
      - main
      - staging
      - 'release/**'
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Go 1.22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false

      - name: Verify Go Code Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Download Go Module Dependencies
        run: |
          go mod tidy
          go mod download

      - name: Run Backend Unit Tests
        run: go test -v -race ./...

      - name: Build API Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -ldflags="-w -s" -o bin/api ./api/main.go

      - name: Build Worker Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -ldflags="-w -s" -o bin/worker ./worker/main.go

  frontend-ci:
    name: Frontend CI (Node 20 / Nuxt 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Run Nuxt Production Build (Nitro SSR)
        run: npm run build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_API_URL: https://api.sms-test.ztechai.us
          NUXT_PUBLIC_APP_NAME: ZSMS

  docker-lint:
    name: Dockerfile Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: zsms-backend:ci-check

      - name: Validate Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: zsms-web:ci-check
